<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hide & Seek</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
        font-family: "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #e8eefc;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      }

      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 14px;
        transform: translate(-50%, -50%);
        opacity: 0.85;
      }

      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: #e8eefc;
      }

      #crosshair::before {
        left: 6px;
        top: 0;
        width: 2px;
        height: 14px;
      }

      #crosshair::after {
        left: 0;
        top: 6px;
        width: 14px;
        height: 2px;
      }

      #status {
        position: absolute;
        top: max(1.25rem, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        max-width: min(36rem, 92vw);
      }

      #status h1 {
        font-size: clamp(1.1rem, 2.5vw, 1.6rem);
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      #status p {
        margin-top: 0.35rem;
        font-size: 0.95rem;
        opacity: 0.9;
      }

      #hint {
        position: absolute;
        left: 1.25rem;
        bottom: 1.25rem;
        font-size: 0.85rem;
        line-height: 1.45;
        opacity: 0.8;
      }

      #hint.touchHint {
        left: 50%;
        bottom: auto;
        top: max(4.75rem, calc(env(safe-area-inset-top) + 3.5rem));
        transform: translateX(-50%);
        text-align: center;
        max-width: min(22rem, 92vw);
        font-size: 0.8rem;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at center, rgba(20, 40, 80, 0.55), rgba(5, 10, 20, 0.88)),
          #0b1220;
        color: #e8eefc;
        pointer-events: auto;
        z-index: 2;
      }

      #overlay.hidden {
        display: none;
      }

      #overlay .panel {
        text-align: center;
        padding: 2rem;
        max-width: 32rem;
        max-height: 100dvh;
        overflow: auto;
      }

      #overlay h1 {
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 0.75rem;
      }

      #overlay p {
        opacity: 0.9;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }

      #overlayActions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }

      #overlay button {
        pointer-events: auto;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.75rem 1.4rem;
        font-size: 1rem;
        font-weight: 600;
        color: #0b1220;
        background: #7dd3fc;
        cursor: pointer;
      }

      #overlay button:hover {
        background: #bae6fd;
      }

      #overlay button.secondary {
        background: transparent;
        color: #e8eefc;
        outline: 1px solid rgba(232, 238, 252, 0.35);
      }

      #overlay button.secondary:hover {
        background: rgba(232, 238, 252, 0.08);
      }

      #overlayExtra .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }

      #overlayExtra .field {
        display: grid;
        gap: 0.4rem;
        text-align: left;
        margin: 0 auto 1.25rem;
        max-width: 16rem;
      }

      #overlayExtra .field span {
        font-size: 0.85rem;
        opacity: 0.85;
      }

      #overlayExtra input {
        width: 100%;
        border: 1px solid rgba(232, 238, 252, 0.35);
        border-radius: 0.5rem;
        padding: 0.7rem 0.85rem;
        font-size: 1.1rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-align: center;
        color: #e8eefc;
        background: rgba(8, 14, 28, 0.85);
        outline: none;
      }

      #overlayExtra input:focus {
        border-color: #7dd3fc;
      }

      #touchControls {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      #touchControls.hidden {
        display: none;
      }

      .touch-left {
        position: absolute;
        left: max(0.85rem, env(safe-area-inset-left));
        bottom: max(0.85rem, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 0.7rem;
        pointer-events: none;
        z-index: 2;
      }

      .touch-left > * {
        pointer-events: auto;
      }

      .touch-stick {
        position: relative;
        width: 7.5rem;
        height: 7.5rem;
        touch-action: none;
      }

      .touch-stick-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(232, 238, 252, 0.35);
        background: rgba(8, 14, 28, 0.35);
      }

      .touch-stick-knob {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: rgba(125, 211, 252, 0.75);
        border: 2px solid rgba(232, 238, 252, 0.55);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      .touch-look {
        position: absolute;
        top: 0;
        right: 0;
        width: 52%;
        height: 100%;
        pointer-events: auto;
        touch-action: none;
        z-index: 1;
      }

      .touch-sprint,
      .touch-crouch {
        pointer-events: auto;
        touch-action: none;
        border: 2px solid rgba(232, 238, 252, 0.4);
        border-radius: 999px;
        min-width: 4.6rem;
        min-height: 3.15rem;
        padding: 0.85rem 1.2rem;
        font-size: 0.95rem;
        font-weight: 650;
        color: #e8eefc;
        background: rgba(8, 14, 28, 0.45);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
        -webkit-user-select: none;
        user-select: none;
      }

      .touch-sprint:focus,
      .touch-crouch:focus {
        outline: none;
      }

      .touch-sprint {
        position: absolute;
        right: max(0.85rem, env(safe-area-inset-right));
        bottom: max(0.85rem, env(safe-area-inset-bottom));
        z-index: 2;
      }

      .touch-sprint.active,
      .touch-crouch.active {
        background: rgba(125, 211, 252, 0.55);
        color: #0b1220;
        text-shadow: none;
      }

      @media (orientation: landscape) {
        .touch-left {
          flex-direction: row;
          align-items: flex-end;
          gap: 0.85rem;
        }

        .touch-look {
          width: 48%;
          top: 0;
          bottom: 4.6rem;
          height: auto;
        }

        .touch-sprint,
        .touch-crouch {
          min-height: 2.9rem;
        }
      }

      @media (orientation: landscape) and (max-height: 500px) {
        #status {
          top: max(0.4rem, env(safe-area-inset-top));
        }

        #status h1 {
          font-size: 1.05rem;
        }

        #status p {
          font-size: 0.8rem;
          margin-top: 0.12rem;
        }

        #hint.touchHint {
          top: max(2.5rem, calc(env(safe-area-inset-top) + 1.9rem));
          font-size: 0.72rem;
          max-width: min(28rem, 72vw);
        }

        #overlay .panel {
          padding: 1rem 1.5rem;
        }

        #overlay h1 {
          font-size: clamp(1.35rem, 5.5vh, 2.1rem);
          margin-bottom: 0.35rem;
        }

        #overlay p {
          margin-bottom: 0.85rem;
          font-size: 0.9rem;
        }

        #overlay button {
          padding: 0.6rem 1.15rem;
        }

        .touch-stick {
          width: 6.75rem;
          height: 6.75rem;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas" tabindex="0"></canvas>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="status">
        <h1 id="phaseTitle">Click to start</h1>
        <p id="phaseDetail">Hide behind cover before the seeker starts hunting.</p>
      </div>
      <div id="hint">
        WASD move · mouse look · Shift sprint · hold C crouch<br />
        Esc releases the mouse
      </div>
    </div>
    <div id="overlay">
      <div class="panel">
        <h1 id="overlayTitle">Hide & Seek</h1>
        <p id="overlayText">Choose how you want to play.</p>
        <div id="overlayExtra"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
